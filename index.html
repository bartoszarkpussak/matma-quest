<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matma Quest">
<meta name="theme-color" content="#2b1055">
<title>Matma Quest Amelii</title>
<style>
:root{
  --ink:#22183a; --muted:#6b6385; --ok:#16a34a; --bad:#e11d48; --gold:#f6b40e;
  --wc:#8b5cf6; --wc2:#6d28d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:#2b1055 linear-gradient(165deg,#2b1055 0%,#5b2a86 45%,#3d6fd1 100%) fixed;
  min-height:100dvh; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
#app{position:relative;z-index:1}

/* ---------- home ---------- */
.home{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.top{display:flex;align-items:center;gap:8px;color:#fff}
.av{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px;border:2px solid rgba(255,255,255,.4);flex:none}
.hello{font-weight:900;font-size:18px;flex:1;line-height:1.1}
.hello small{display:none}
.pill{background:rgba(0,0,0,.28);border-radius:999px;padding:7px 9px;font-weight:900;font-size:15px;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:19px;width:38px;height:38px;border-radius:13px;flex:none}
.logo{color:#fff;text-align:center;margin:18px 0 4px}
.logo h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.logo h1 span{color:var(--gold)}
.logo p{margin:4px 0 0;font-weight:700;opacity:.85;font-size:14px}
.bubble{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:20px;padding:12px 14px;margin:14px 0 4px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.18);font-size:15px;line-height:1.35}
.bubble .m{font-size:32px;line-height:1}
.bubble b{color:#7c3aed}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.wcard{border:0;border-radius:22px;padding:14px 12px 12px;color:#fff;text-align:left;
  background:linear-gradient(150deg,var(--wc),var(--wc2));box-shadow:0 6px 0 rgba(0,0,0,.28);position:relative;overflow:hidden;transition:transform .08s}
.wcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.wcard .we{font-size:40px;line-height:1}
.wcard .wn{font-weight:900;font-size:17px;line-height:1.1;margin-top:6px}
.wcard .wt{font-size:12.5px;font-weight:700;opacity:.92;margin-top:3px}
.wcard .wst{margin-top:8px;font-size:17px;letter-spacing:1px}
.wcard .wst .off{opacity:.35;filter:grayscale(1)}
.wcard.boss{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.wcard.boss .we{font-size:50px}
.wcard.locked{filter:saturate(.35) brightness(.8)}
.wcard .lock{position:absolute;right:12px;top:10px;font-size:20px}
.foot{color:#fff;opacity:.75;text-align:center;font-size:12.5px;font-weight:700;margin-top:18px;line-height:1.4}
.streak{display:inline-block;margin-top:8px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}

/* ---------- lesson ---------- */
.lesson{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.lhead{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(150deg,var(--wc),var(--wc2));box-shadow:0 6px 0 rgba(0,0,0,.28);margin-top:10px}
.lhead .we{font-size:52px;line-height:1}
.lhead h2{margin:6px 0 0;font-size:26px;font-weight:900}
.lhead p{margin:4px 0 0;font-weight:700;opacity:.9}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 7px 0 rgba(0,0,0,.18)}
.lcard{margin-top:14px;font-size:16px;line-height:1.5;font-weight:600}
.lcard h3{margin:14px 0 6px;font-size:18px;font-weight:900;color:var(--wc2)}
.lcard h3:first-child{margin-top:0}
.ex{background:#f5f2ff;border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:800;font-size:18px}
.trap{background:#fff1f3;border:2px dashed #fda4af;border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700}
.trap .x{color:var(--bad)} .trap .v{color:var(--ok)}
.rule{background:#fff8db;border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:800}
.bigbtn{display:block;width:100%;border:0;border-radius:20px;padding:17px;font-size:21px;font-weight:900;margin-top:16px;background:var(--gold);color:#3b2600;box-shadow:0 6px 0 #b8860b}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.back{background:none;border:0;color:#fff;font-weight:800;font-size:16px;padding:6px 0}

/* ---------- play ---------- */
.play{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:8px;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.ptitle{flex:1;font-weight:900;font-size:17px;text-align:center;line-height:1.1}
.track{display:flex;align-items:flex-end;gap:4px;padding:30px 14px 8px}
.blk{flex:1;height:13px;border-radius:5px;background:rgba(255,255,255,.22);position:relative;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.blk.done{background:var(--gold)}
.blk.miss{background:#fb7185}
.blk.cur{background:#fff}
.blk .me{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;animation:hop .45s ease-out}
.flag{font-size:20px;margin-left:2px;line-height:1}
@keyframes hop{0%{transform:translate(-50%,0)}40%{transform:translate(-50%,-14px)}100%{transform:translate(-50%,0)}}
.scroll{flex:1;overflow-y:auto;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
.qnum{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.tag{background:#f1ebff;color:#6d28d9;border-radius:999px;padding:3px 9px;text-transform:none;letter-spacing:0}
.qtext{font-size:18.5px;font-weight:700;line-height:1.45}
.qtext .big{display:block;font-size:31px;font-weight:900;text-align:center;margin:8px 0 2px;color:var(--wc2)}
sup{font-size:.6em}
.ptable{border-collapse:collapse;margin:8px 0;font-size:16px;width:100%}
.ptable td,.ptable th{border:2px solid #e7e2f5;padding:6px 8px;text-align:left}
.ptable th{background:#f5f2ff}
.frow{display:flex;align-items:center;gap:8px;margin-top:10px}
.flabel{font-weight:800;font-size:16px;flex:1;line-height:1.25}
.field{min-width:112px;height:50px;border:3px solid #d9d3ee;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;background:#f7f5ff;padding:0 8px;flex:none}
.field.active{border-color:var(--wc);box-shadow:0 0 0 4px rgba(139,92,246,.22);background:#fff}
.field.active .fv:empty::after,.field.active .fv::after{content:"";display:inline-block;width:2px;height:24px;background:var(--wc);margin-left:2px;vertical-align:-3px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.field.ok{border-color:var(--ok);background:#ecfdf3}
.field.bad{border-color:var(--bad);background:#fff1f3;animation:shake .4s}
.unit{font-weight:800;color:var(--muted);flex:none}
.clabel{font-weight:900;margin-top:14px;font-size:16px}
.choices{display:grid;gap:8px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{border:3px solid #e3def3;background:#faf8ff;border-radius:16px;padding:13px 12px;font-weight:900;font-size:18px;text-align:center;box-shadow:0 4px 0 #e3def3}
.choice.sel{border-color:var(--wc);background:#f1ebff;box-shadow:0 4px 0 var(--wc)}
.choice.ok{border-color:var(--ok);background:#ecfdf3;box-shadow:0 4px 0 var(--ok)}
.choice.bad{border-color:var(--bad);background:#fff1f3;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{margin-top:12px;border-radius:16px;padding:0;font-weight:800;font-size:16px;line-height:1.4}
.fb:empty{display:none}
.fb.ok{background:#ecfdf3;border:2px solid #86efac;padding:11px 13px;color:#14532d}
.fb.bad{background:#fff1f3;border:2px solid #fda4af;padding:11px 13px;color:#881337}
.fb.warn{background:#fff8db;border:2px solid #fcd34d;padding:11px 13px;color:#713f12}
.fb .cheer{font-size:22px;font-weight:900;display:block}
.fb .sol{display:block;margin-top:6px;font-weight:700;color:#14532d}
.linkbtn{background:none;border:0;padding:0;margin-top:6px;font-weight:900;color:#7c3aed;text-decoration:underline;font-size:15px;display:block}
.hint{margin-top:10px;background:#fff8db;border-radius:14px;padding:10px 12px;font-weight:700;font-size:15.5px;line-height:1.45;animation:pop .25s}
.hint .hn{font-weight:900;color:#a16207}
.hint.solution{background:#eef6ff;border:2px solid #93c5fd}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.dots{display:grid;gap:3px;margin:8px auto 4px;max-width:200px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--wc)}
.mults{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mults span{background:#fff;border:2px solid #f0e3a6;border-radius:10px;padding:3px 7px;font-weight:800;font-size:14px}
.mults span.best{background:#dcfce7;border-color:#22c55e}
.mults span.over{background:#ffe4e6;border-color:#fb7185;text-decoration:line-through}

.wbox{margin-top:12px;background:#f5f2ff;border-radius:16px;padding:12px;text-align:center}
.wlabel{font-weight:800;font-size:14px;color:var(--muted);margin-bottom:8px}
.zrow{display:flex;justify-content:center;align-items:center;gap:10px;font-size:34px;font-weight:900}
.dg{display:inline-block;transition:all .3s}
.dg.frozen{color:#7dd3fc;text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#0284c7;transform:scale(.85)}
.znote{margin-top:8px;font-weight:800}
.mini{border:0;border-radius:12px;padding:9px 14px;font-weight:900;font-size:15px;background:var(--wc);color:#fff;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mini.ghost{background:#e9e3fb;color:var(--ink);box-shadow:0 4px 0 #d6cdf5;margin-left:6px}
.chips{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}
.chip{border:3px solid #d9d3ee;background:#fff;border-radius:14px;min-width:58px;padding:9px 10px;font-weight:900;font-size:24px;box-shadow:0 4px 0 #d9d3ee}
.chip.sel{border-color:var(--wc);background:#f1ebff;transform:translateY(-3px)}
.chip.gold{background:linear-gradient(150deg,#fde68a,#f6b40e);border-color:#d39e00;box-shadow:0 4px 0 #b8860b}
.chip.shake{animation:shake .4s}
.chips .dot{font-weight:900;font-size:24px;color:var(--muted)}
.wmsg{margin-top:8px;font-weight:800;font-size:14.5px;min-height:20px}

.bottom{background:rgba(255,255,255,.96);border-radius:24px 24px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -6px 20px rgba(0,0,0,.15)}
.actions{display:flex;gap:8px}
.btn{border:0;border-radius:17px;font-weight:900;font-size:18px;padding:14px 10px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45}
.btn.go{flex:1.5;background:linear-gradient(150deg,var(--wc),var(--wc2));color:#fff}
.btn.hb{flex:1;background:#fff1b8;color:#7a5600;font-size:15.5px;white-space:nowrap}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.key{border:0;border-radius:14px;background:#efeaff;font-size:25px;font-weight:900;height:48px;box-shadow:0 4px 0 #d6cdf5;color:var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #d6cdf5}
.key.fn{background:#e2e8f0;box-shadow:0 4px 0 #cbd5e1;font-size:21px}

/* ---------- results / shop ---------- */
.res{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 16px 30px;text-align:center;color:#fff}
.res .bigstars{font-size:56px;letter-spacing:6px;margin:10px 0}
.res .bigstars span{display:inline-block;animation:starIn .5s both}
.res .bigstars span:nth-child(2){animation-delay:.25s}
.res .bigstars span:nth-child(3){animation-delay:.5s}
.res .bigstars .off{opacity:.25;filter:grayscale(1)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.res h2{font-size:30px;margin:6px 0;font-weight:900}
.res .card{color:var(--ink);text-align:left;margin-top:16px;font-weight:700;line-height:1.5}
.res .row{display:flex;gap:10px;margin-top:4px}
.res .row .bigbtn{flex:1}
.bigbtn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 #c4b5fd}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sitem{border:0;background:#fff;border-radius:18px;padding:12px 6px;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center}
.sitem .e{font-size:40px;line-height:1.1}
.sitem .p{font-weight:900;font-size:14px;margin-top:4px}
.sitem.on{outline:4px solid var(--gold)}
.sitem.no{opacity:.55}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#22183a;color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;font-size:15px;z-index:50;max-width:90vw;text-align:center;animation:pop .2s}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .card{width:100%;max-width:540px;max-height:85dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.conf{position:fixed;top:-40px;font-size:26px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.coinfly{position:fixed;z-index:60;font-weight:900;color:var(--gold);font-size:22px;pointer-events:none;animation:up 1s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{flex:1;border:0;border-radius:15px;padding:11px 8px;font-weight:900;font-size:16px;background:rgba(255,255,255,.15);color:#fff}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.new{background:var(--gold);color:#3b2600;border-radius:999px;padding:2px 7px;font-size:11px;margin-left:4px;vertical-align:2px}
.qbox{display:inline-block;min-width:1.3em;border:3px dashed #a78bfa;border-radius:10px;padding:0 .15em;color:#a78bfa;line-height:1.2}
.parentbtn{margin-top:10px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.holdbtn{position:relative;overflow:hidden;width:100%;border:0;border-radius:18px;height:58px;background:#efeaff;font-size:19px;margin-top:10px;touch-action:none}
.holdbtn #holdfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#c4b5fd}
.holdbtn b{position:relative}
.parent .logo p{opacity:.85}
.ph{color:#fff;margin:20px 0 8px;font-size:18px;font-weight:900}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kpis b{display:block;font-size:22px;font-weight:900}
.kpis span{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.2;display:block}
.advice{margin-top:12px;background:#f5f2ff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14.5px;line-height:1.5}
.tblwrap{padding:8px;overflow-x:auto}
.ptbl{border-collapse:collapse;width:100%;font-size:12.5px}
.ptbl th{font-size:11px;color:var(--muted);text-align:left;padding:5px 4px;border-bottom:2px solid #eee}
.ptbl td{padding:7px 3px;border-bottom:1px solid #f0edf7;font-weight:700;white-space:nowrap}
.ptbl td:first-child{white-space:normal}
.pct{border-radius:8px;padding:1px 6px;font-weight:900}
.pct.g{background:#dcfce7;color:#166534}.pct.y{background:#fef3c7;color:#92400e}.pct.r{background:#ffe4e6;color:#9f1239}
.pnote{color:#fff;opacity:.8;font-size:12.5px;font-weight:700;margin:8px 4px 0}
.tro{padding:10px 0;border-bottom:1px solid #f0edf7}.tro:last-child{border-bottom:0}
.tro-h{font-size:12px;font-weight:800;color:var(--muted)}
.tro-q{font-weight:700;margin:4px 0;font-size:14.5px}
.tro-a{font-size:14px;font-weight:700}.tro-a .x{color:var(--bad)}.tro-a .v{color:var(--ok)}
.snakecard{display:flex;align-items:center;gap:14px;width:100%;margin-top:14px}
.snakecard .we{font-size:46px}
.snake .stask{margin:4px 12px 0;padding:10px 14px;text-align:center}
.sq{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stext{font-size:28px;font-weight:900;color:#15803d;line-height:1.2;margin-top:2px}
.stext.pop{animation:pop .35s}
.shint{font-size:14.5px;font-weight:800;color:#a16207;margin-top:4px}
.shint:empty{display:none}
.hearts{font-size:17px;min-width:72px;text-align:right;letter-spacing:-1px}
.sboard{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:8px 12px;touch-action:none;overflow:hidden}
.stext .sl{display:block;font-size:14px;color:var(--muted);font-weight:800}
.sboard canvas{border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.25);touch-action:none}
.sover{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:rgba(20,10,40,.82);color:#fff;font-weight:800;padding:13px 14px;border-radius:14px;text-align:center;font-size:15px;pointer-events:none}
.smsg{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;font-weight:900;padding:8px 14px;border-radius:12px;white-space:nowrap;animation:pop .2s;pointer-events:none;font-size:15px}
.smsg.ok{background:#16a34a}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 12px calc(env(safe-area-inset-bottom) + 10px)}
.dk{border:0;border-radius:16px;height:54px;font-size:24px;font-weight:900;background:rgba(255,255,255,.94);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:manipulation}
.dk:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.dk.fn{background:#fff1b8;font-size:21px}
.row2{display:flex;gap:10px}.row2 .bigbtn{flex:1}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div id="app"></div>

<script>
/* ================= narzędzia ================= */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Number(n).toLocaleString('pl-PL');
const zer=n=>n===1?'zero':(n>=2&&n<=4?'zera':'zer');
const P=(a,e)=>`${a}<sup>${e}</sup>`;
function mc(correct,wrongs){const ch=shuffle([correct,...wrongs]);return {choices:ch,correct:ch.indexOf(correct)}}
const $=id=>document.getElementById(id);

/* ================= zapis postępów ================= */
const KEY='matmaQuestAmelia_v1';
const S={coins:0,avatar:'🦊',owned:['🦊'],stars:{},sound:true,solved:0,streak:0,lastDay:'',season:1,stats:{},log:[],trouble:[],statsSince:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}

/* ================= dźwięki ================= */
let AC=null;
function tone(freqs,dur=.12,type='sine',vol=.18){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(vol,t+i*dur+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g);g.connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+.03)});
  }catch(e){}
}
const sOk=()=>tone([660,880,1320],.11,'triangle');
const sBad=()=>tone([330,220],.18,'sawtooth',.08);
const sTap=()=>tone([520],.05,'sine',.06);
const sMagic=()=>tone([1047,1319,1568,2093],.07,'sine',.12);
const sWin=()=>tone([523,659,784,1047,784,1047],.13,'triangle');

function confetti(set=['⭐','✨','💎','🎉','💜','❄️']){
  for(let i=0;i<24;i++){const s=document.createElement('div');s.className='conf';s.textContent=pick(set);
    s.style.left=R(0,95)+'vw';s.style.animationDuration=(R(14,26)/10)+'s';s.style.animationDelay=(R(0,5)/10)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}
}
function coinFly(n,el){if(!n)return;const r=(el||document.body).getBoundingClientRect();const c=document.createElement('div');c.className='coinfly';c.textContent='+'+n+' 💎';
  c.style.left=(r.left+r.width/2-30)+'px';c.style.top=(r.top-10)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),1000)}
let toastT;
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}<button class="bigbtn" onclick="this.closest('.modal').remove()">Wracam do gry 👍</button></div>`;

/* ================= podpowiedzi wizualne ================= */
function dotGrid(a){return `<div class="dots" style="grid-template-columns:repeat(${a},1fr)">${'<i></i>'.repeat(a*a)}</div><div style="text-align:center">${a} rzędów po ${a} kropek = <b>${a*a}</b></div>`}
function multTable(b,a){let h='<div class="mults">';for(let k=1;k<=13;k++){const v=b*k;const cls=v>a?'over':(v<=a&&v+b>a?'best':'');h+=`<span class="${cls}">${b}·${k}=${v}</span>`;if(v>a)break}return h+'</div>'}

// 🏰 Potęgi
function genPot(){
  const t=Math.random();
  if(t<.35){
    const a=R(2,12);
    return {key:'p2'+a,html:`Oblicz w pamięci:<span class="big">${P(a,2)} = ?</span>`,
      fields:[{label:`${P(a,2)} =`,ans:a*a}],
      hints:[`Mała dwójka u góry znaczy: napisz <b>${a}</b> dwa razy i pomnóż. To NIE jest mnożenie przez 2!`,
        `${P(a,2)} = ${a} · ${a}`,
        a<=10?dotGrid(a):`${a} · ${a} = ${a}·10 + ${a}·${a-10} = ${a*10} + ${a*(a-10)}`],
      trap:v=>v[0]===a*a?null:v[0]===2*a?`Ups! ${2*a} to ${a} · 2. A ${P(a,2)} to ${a} · ${a} — liczba razy ona sama! 😉`:(v[0]===a+2?`To było dodawanie. ${P(a,2)} = ${a} · ${a}`:null),
      solution:`${P(a,2)} = ${a} · ${a} = <b>${a*a}</b>`};
  }
  if(t<.55){
    const a=pick([2,3,4,5,10]);
    return {key:'p3'+a,html:`Oblicz w pamięci:<span class="big">${P(a,3)} = ?</span>`,
      fields:[{label:`${P(a,3)} =`,ans:a**3}],
      hints:[`Trójka u góry: napisz <b>${a}</b> trzy razy i pomnóż.`,`${P(a,3)} = ${a} · ${a} · ${a}`,`Najpierw ${a} · ${a} = ${a*a}, potem ${a*a} · ${a} = ?`],
      trap:v=>v[0]===a**3?null:v[0]===3*a?`To jest ${a} · 3. A ${P(a,3)} = ${a} · ${a} · ${a}! 🏰`:(v[0]===a*a?`Za mało! To było ${P(a,2)}. Potrzebujesz trzech ${a}.`:null),
      solution:`${P(a,3)} = ${a} · ${a} · ${a} = ${a*a} · ${a} = <b>${a**3}</b>`};
  }
  if(t<.7){
    const a=R(4,9),e=pick([2,3]);
    const m=e===2?mc(`${a} · ${a}`,[`${a} · 2`,`${a} + ${a}`,`${a} · ${a} · ${a}`]):mc(`${a} · ${a} · ${a}`,[`${a} · 3`,`${a} + ${a} + ${a}`,`${a} · ${a}`]);
    return {key:'pm'+a+e,html:`Co oznacza zapis <b style="font-size:26px">${P(a,e)}</b>?`,...m,
      hints:[`Cyferka u góry mówi, <b>ile razy</b> liczba ${a} stoi w mnożeniu.`,`${e===2?'Dwa':'Trzy'} razy ${a}, połączone kropką mnożenia.`],
      solution:`${P(a,e)} = ${Array(e).fill(a).join(' · ')} = <b>${a**e}</b>`};
  }
  if(t<.85){
    const pr=pick([[2,3,3,2],[2,4,4,2],[3,3,5,2],[2,5,5,2],[4,3,8,2],[10,2,5,3],[6,2,3,3],[7,2,4,3],[3,2,2,3],[1,5,5,1]]);
    const [a,m,b,n]=Math.random()<.5?pr:[pr[2],pr[3],pr[0],pr[1]];
    const x=a**m,y=b**n;
    const A=P(a,m),B=P(b,n);
    const ch=[A,B,'Są równe'];const correct=x>y?0:(y>x?1:2);
    return {key:'pc'+a+m+b+n,html:`Która liczba jest większa?<span class="big">${A} &nbsp;czy&nbsp; ${B}</span>`,choices:ch,correct,
      hints:[`Policz każdą osobno. Pamiętaj: potęga to mnożenie tej samej liczby!`,`${A} = ${Array(m).fill(a).join(' · ')} &nbsp;&nbsp; ${B} = ${Array(n).fill(b).join(' · ')}`],
      trap:(v,c)=>c!==correct&&ch[c]!=='Są równe'?`Policz dokładnie: ${A} = ${x}, a ${B} = ?`:null,
      solution:`${A} = <b>${x}</b>, ${B} = <b>${y}</b>`};
  }
  if(Math.random()<.5){
    const k=R(2,5),a=R(2,6);
    return {key:'pk'+k+a,html:`Oblicz (uwaga na kolejność!):<span class="big">${k} · ${P(a,2)} = ?</span>`,fields:[{label:'Wynik =',ans:k*a*a}],
      hints:[`Najpierw <b>potęga</b>, potem mnożenie.`,`${P(a,2)} = ${a} · ${a} = ${a*a}`,`${k} · ${a*a} = ?`],
      trap:v=>v[0]===k*a*a?null:v[0]===(k*a)**2?`Najpierw potęga! Ty policzyłaś (${k}·${a})<sup>2</sup>. Policz ${P(a,2)}, a dopiero potem razy ${k}.`:(v[0]===k*a*2?`${P(a,2)} to nie ${a}·2 😉`:null),
      solution:`${P(a,2)} = ${a*a}, więc ${k} · ${a*a} = <b>${k*a*a}</b>`};
  }
  const a=R(2,7),b=R(2,7);
  return {key:'ps'+a+b,html:`Oblicz:<span class="big">${P(a,2)} + ${P(b,2)} = ?</span>`,fields:[{label:'Wynik =',ans:a*a+b*b}],
    hints:[`Policz każdą potęgę osobno, potem dodaj.`,`${P(a,2)} = ${a*a}, a ${P(b,2)} = ?`],
    trap:v=>v[0]===a*a+b*b?null:v[0]===2*a+2*b?`Ojej, to było mnożenie przez 2. ${P(a,2)} = ${a}·${a}!`:(v[0]===(a+b)**2?`Najpierw policz potęgi osobno, potem dodaj.`:null),
    solution:`${a*a} + ${b*b} = <b>${a*a+b*b}</b>`};
}

// ❄️ Zera
function genZera(){

    const d1=pick([2,3,4,5,6,7,8,9,12,15,25]),d2=R(2,9);
    let k1=R(0,3),k2=R(1,2);if(k1+k2>4)k1=4-k2;
    const A=d1*10**k1,B=d2*10**k2,ans=A*B,z=k1+k2;
    return {key:'zm'+A+'x'+B,html:`Oblicz w pamięci:<span class="big">${fmt(A)} · ${fmt(B)} = ?</span>`,fields:[{label:'Wynik =',ans}],
      hints:[`Zakryj zera i pomnóż to, co zostało: <b>${d1} · ${d2}</b>`,`${d1} · ${d2} = ${d1*d2}`,`Policz wszystkie zera z końca obu liczb: ${k1} + ${k2} = ${z}. Dopisz je do ${d1*d2}.`],
      trap:v=>(v[0]*10===ans||v[0]===ans*10||v[0]*100===ans||v[0]===ans*100)?`Prawie! Policz zera ❄️ — razem jest ich ${z}, dopisz je do ${d1*d2}.`:null,
      solution:`${d1} · ${d2} = ${d1*d2}, dopisuję ${z} ${zer(z)} → <b>${fmt(ans)}</b>`};
  }
  const d=R(2,9),e=R(2,9);
  let k=Math.random()<.75?R(1,2):0,m=R(0,2);if(k+m===0)m=1;
  const B=d*10**k,q=e*10**m,A=B*q;
  const core=d*e*10**m;
  return {key:'zd'+A+':'+B,html:`Oblicz w pamięci:<span class="big">${fmt(A)} : ${fmt(B)} = ?</span>`,fields:[{label:'Wynik =',ans:q}],
    widget:k>0?{type:'zeros',a:A,b:B}:null,
    hints:k>0?[`Zamroź ❄️ tyle samo zer na końcu obu liczb — użyj przycisku powyżej!`,`Po zamrożeniu zostaje: <b>${fmt(core)} : ${d}</b>`,`${d*e} : ${d} = ${e}${m?`, dopisz ${m} ${zer(m)}`:''} → ?`]
            :[`Dzielnik ${d} nie ma zer. Podziel samą „główkę”: <b>${d*e} : ${d}</b>`,`${d*e} : ${d} = ${e}`,`Dopisz zera, które zostały w ${fmt(A)}: ${m} ${zer(m)}.`],
    trap:v=>(v[0]*10===q||v[0]===q*10||v[0]===q*100||v[0]*100===q)?`Ups, za dużo albo za mało zer! Skreśl tyle samo zer w obu liczbach. Sprawdź: ${fmt(v[0])} · ${fmt(B)} = ${fmt(v[0]*B)}, a ma wyjść ${fmt(A)}.`:null,
    solution:`${fmt(A)} : ${fmt(B)} = ${fmt(core)} : ${d} = <b>${fmt(q)}</b>. Sprawdzenie: ${fmt(q)} · ${fmt(B)} = ${fmt(A)} ✔`};
}

// 🧱 Reszta
const NAMES=['Kamil','Tomek','Werka','Amelia','Zuza','Kuba','Ola','Maja','Lena','Antek'];
const GIRLS=['Werka','Amelia','Zuza','Ola','Maja','Lena'];
function genReszta(){
  if(Math.random()<.6){
    const b=R(3,9),q=R(2,12),r=R(1,b-1)*(Math.random()<.9?1:0),a=b*q+r;
    return {key:'r'+a+':'+b,html:`Podziel z resztą:<span class="big">${a} : ${b} = ? r ?</span>`,
      fields:[{label:'Wynik',ans:q},{label:'Reszta (r)',ans:r}],
      hints:[`Ile razy ${b} zmieści się w ${a}? Poszukaj w tabliczce mnożenia przez ${b}:`+multTable(b,a),
        `${b} · ${q} = ${b*q} — to najwięcej, co nie przekracza ${a}. Wynik to ${q}.`,
        `Reszta to to, co zostało: ${a} − ${b*q} = ? <br>⭐ Reszta musi być <b>mniejsza niż ${b}</b>!`],
      trap:v=>{const[qq,rr]=v;if(rr>=b)return `Stop! 🧱 Reszta ${rr} jest ${rr===b?'równa':'większa niż'} ${b}. To znaczy, że ${b} zmieści się jeszcze raz. Reszta musi być mniejsza od ${b}!`;
        if(qq*b+rr!==a)return `Sprawdź: ${qq} · ${b} + ${rr} = ${qq*b+rr}, a powinno wyjść ${a}.`;return null},
      solution:`${a} : ${b} = <b>${q} r ${r}</b>, bo ${b} · ${q} = ${b*q}, a ${a} − ${b*q} = ${r}`};
  }
  const [n1,n2]=shuffle(NAMES).slice(0,2);
  let b1,b2,q1,q2,r1,r2;
  do{b1=R(4,9);b2=R(4,9);q1=R(3,11);q2=R(3,11);r1=R(0,b1-1);r2=R(0,b2-1)}while(r1===r2||b1===b2);
  const a1=b1*q1+r1,a2=b2*q2+r2,big=r1>r2?0:1,diff=Math.abs(r1-r2);
  return {key:'rr'+a1+b1+a2+b2,html:`${n1} podzielił${GIRLS.includes(n1)?'a':''} <b>${a1} przez ${b1}</b>, a ${n2} podzielił${GIRLS.includes(n2)?'a':''} <b>${a2} przez ${b2}</b>. Kto otrzymał większą resztę? O ile większą?`,
    fields:[{label:`Reszta: ${n1}`,ans:r1},{label:`Reszta: ${n2}`,ans:r2},{label:'O ile większa?',ans:diff}],
    choiceLabel:'Kto ma większą resztę?',choices:[n1,n2],correct:big,
    hints:[`Najpierw osobno: ${a1} : ${b1} oraz ${a2} : ${b2}. Każda reszta musi być mniejsza od swojego dzielnika!`,
      `${b1} · ${q1} = ${b1*q1}, więc reszta ${n1}: ${a1} − ${b1*q1} = ?`+multTable(b1,a1),
      `${b2} · ${q2} = ${b2*q2}, więc reszta ${n2}: ${a2} − ${b2*q2} = ?<br>„O ile większa?” → odejmij: większa − mniejsza.`],
    trap:(v,c)=>{if(v[0]>=b1)return `Reszta ${n1} (${v[0]}) nie może być ${v[0]===b1?'równa':'większa od'} ${b1}! 🧱`;if(v[1]>=b2)return `Reszta ${n2} (${v[1]}) nie może być ${v[1]===b2?'równa':'większa od'} ${b2}! 🧱`;
      if(v[0]===r1&&v[1]===r2&&v[2]!==diff&&v[2]===r1+r2)return `„O ile większa” to odejmowanie, nie dodawanie: ${Math.max(r1,r2)} − ${Math.min(r1,r2)}.`;
      if(v[0]===r1&&v[1]===r2&&v[2]!==diff&&v[2]===Math.max(r1,r2))return `Reszty masz dobrze! Ale „o ile większa” = większa − mniejsza.`;return null},
    solution:`${a1} : ${b1} = ${q1} r <b>${r1}</b>, &nbsp; ${a2} : ${b2} = ${q2} r <b>${r2}</b>.<br>Większą resztę ma <b>${big?n2:n1}</b>, o ${Math.max(r1,r2)} − ${Math.min(r1,r2)} = <b>${diff}</b>.`};
}

// 🧞 Sprytne pary
const FRIENDS=[[2,5],[4,25],[5,20],[2,50],[25,8],[5,40],[50,4],[125,8],[20,50],[25,4]];
function genSpryt(){
  if(Math.random()<.22){
    const f=pick(FRIENDS);
    const wr=shuffle([[3,25],[4,24],[7,15],[8,12],[3,35],[9,11],[4,26],[5,19],[2,49],[6,15]]).slice(0,3);
    const m=mc(`${f[0]} · ${f[1]}`,wr.map(w=>`${w[0]} · ${w[1]}`));
    return {key:'sc'+f,html:`Która para to <b>sprytni przyjaciele</b>? Ich iloczyn daje 10, 100, 200 albo 1000.`,...m,
      hints:[`Przyjaciele: 2·5, 4·25, 20·5, 2·50, 8·125… Szukaj podobnych!`],
      solution:`${f[0]} · ${f[1]} = <b>${f[0]*f[1]}</b> 🎉`};
  }
  const [p,q]=pick(FRIENDS);let x;do{x=R(6,49)}while(x%5===0||x===p||x===q);
  const ord=shuffle([p,x,q]);if(ord[0]===x&&ord[2]!==x&&Math.random()<.5)ord.reverse();
  const pq=p*q,ans=pq*x;
  return {key:'s'+ord.join('.'),html:`Policz sprytnie:<span class="big">${ord.join(' · ')} = ?</span>`,
    widget:{type:'pairs',factors:ord},fields:[{label:'Wynik =',ans}],
    hints:[`Kolejność mnożenia można zmieniać! Znajdź dwie liczby, które razem dają okrągłą liczbę. Stuknij je w okienku powyżej 🤝`,
      `Przyjaciele to <b>${p} i ${q}</b>: ${p} · ${q} = ${pq} 🎉`,
      `Teraz ${pq} · ${x} — dopisz zera do ${x}.`],
    trap:v=>{const w=v[0];if(w===ans)return null;if(w===pq*p||w===pq*q)return `Uważaj! Jedna liczba została użyta dwa razy, a <b>${x}</b> się zgubiła. Każda liczba — dokładnie raz!`;
      if(w===pq)return `Zgubiła się liczba <b>${x}</b>! Pomnóż jeszcze ${pq} · ${x}.`;
      if(w===x*p||w===x*q)return `Jedna liczba się zgubiła. Policz najpierw ${p} · ${q}.`;return null},
    solution:`${p} · ${q} = ${pq}, a ${pq} · ${x} = <b>${fmt(ans)}</b>`};
}

      hints:[`Plan w 3 krokach: 1) dodaj ceny zakupów (każdą RAZ), 2) policz ${k} · ${p}, 3) dodaj oba wyniki i porównaj z budżetem.`,
        `1) ${its[0][1]} + ${its[1][1]} + ${its[2][1]} = ? &nbsp; 2) ${k} · ${p} = ?`,
        `Zakreśl wynik kroku 1 i podpisz „wydane”. W kroku 3 dodajesz tylko: wydane + ${k}·${p}. Potem: czy to więcej niż ${B} zł?`],
      trap:(v,c)=>{
        if(v[2]===2*Sum+kp||v[2]===2*Sum)return `Stop! 🛑 Zakupy policzone dwa razy! Sumę ${v[0]===Sum?Sum:'zakupów'} zł dodajesz tylko RAZ: wydane + ${k}·${p}.`;
        if(v[1]===k+p)return `Krok 2 to mnożenie: ${k} · ${p}, nie ${k} + ${p}.`;
        if(v[0]===Sum&&v[1]===kp&&v[2]===Sum+kp&&c!==(ok?0:1))return `Liczby masz super! Teraz porównaj: ${Sum+kp} zł ${ok?'≤':'>'} ${B} zł?`;
        return null},
      solution:`1) ${its.map(i=>i[1]).join(' + ')} = <b>${Sum} zł</b><br>2) ${k} · ${p} = <b>${kp} zł</b><br>3) ${Sum} + ${kp} = <b>${Sum+kp} zł</b> ${ok?'≤':'>'} ${B} zł → <b>${ok?'wystarczy':'nie wystarczy'}</b>`};
  }
  const T=pick(TABLES);const rows=T.rows.map(r=>[r[0],R(Math.max(8,r[1]-6),r[1]+6)]);
  const [X,Y]=shuffle([0,1,2]).slice(0,2);const a=R(2,6),b=R(2,6);
  const tx=a*rows[X][1],ty=b*rows[Y][1],tot=tx+ty;
  let B=Math.round((tot+pick([-30,-20,-10,10,20,30]))/10)*10;if(B===tot)B+=10;
  const more=tot>B;
  return {key:'zt'+tx+ty+B,html:`<b>${T.title}</b> — cennik:<table class="ptable"><tr><th>Produkt</th><th>Cena</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} zł</td></tr>`).join('')}</table>Za <b>${a} × ${rows[X][0]}</b> i <b>${b} × ${rows[Y][0]}</b> zapłacimy więcej czy mniej niż <b>${B} zł</b>?`,
    fields:[{label:`${a} · ${rows[X][1]} =`,ans:tx,unit:'zł'},{label:`${b} · ${rows[Y][1]} =`,ans:ty,unit:'zł'},{label:'Razem:',ans:tot,unit:'zł'}],
    choiceLabel:`Porównaj z ${B} zł:`,choices:['Więcej','Mniej'],correct:more?0:1,
    hints:[`Najpierw każdy produkt osobno: ilość · cena.`,`${a} · ${rows[X][1]} — możesz liczyć: ${a} · ${Math.floor(rows[X][1]/10)*10} + ${a} · ${rows[X][1]%10}`,`Dodaj oba wyniki i porównaj z ${B} zł.`],
    trap:(v,c)=>v[0]===tx&&v[1]===ty&&v[2]===tot&&c!==(more?0:1)?`Liczby są dobre! Porównaj jeszcze raz: ${tot} zł i ${B} zł.`:null,
    solution:`${a} · ${rows[X][1]} = ${tx} zł, ${b} · ${rows[Y][1]} = ${ty} zł, razem <b>${tot} zł</b> — to <b>${more?'więcej':'mniej'}</b> niż ${B} zł.`};
}

// ⚡ Prawda czy fałsz
function genPF(){
  const TF=['Prawda ✅','Fałsz ❌'];const t=R(1,5);
  if(t===1){
    const a=R(12,89)*100,b=R(2,9)*100,s=a+b;const c=Math.random()<.45?s:pick([a+b*10,s+1000,s-100,s+100]);
    const tr=c===s;
    return {key:'f1'+a+b+c,html:`Suma liczb <b>${fmt(a)}</b> i <b>${b}</b> jest równa <b>${fmt(c)}</b>.`,choices:TF,correct:tr?0:1,
      hints:[`Policz na boku: ${fmt(a)} + ${b} = ?`,`Setki do setek: ${a/100} setek + ${b/100} setek = ${s/100} setek.`],
      trap:(v,ch)=>c===a+b*10&&ch===0?`${b} to tylko ${b/100} setek, a nie ${b/100} tysięcy! 😉`:null,
      solution:`${fmt(a)} + ${b} = <b>${fmt(s)}</b>, więc zdanie to <b>${tr?'prawda':'fałsz'}</b>.`};
  }
  if(t===2){
    const a=R(100,199),b=R(12,59),d=a-b,c=d+pick([-2,-1,0,0,1,2]),rel=pick(['większa','mniejsza']);
    const tr=rel==='większa'?d>c:d<c;
    return {key:'f2'+a+b+c+rel,html:`Różnica liczb <b>${a}</b> i <b>${b}</b> jest ${rel} niż <b>${c}</b>.`,choices:TF,correct:tr?0:1,
      hints:[`Najpierw policz na boku: ${a} − ${b} = ? (możesz pisemnie)`,`${a} − ${b} = ${d}`,`Czy ${d} jest ${rel} niż ${c}? Uwaga: liczba równa nie jest ani większa, ani mniejsza!`],
      trap:(v,ch)=>d===c&&ch===0?`Różnica to dokładnie ${d} — jest RÓWNA ${c}, a równe to nie to samo co ${rel}!`:null,
      solution:`${a} − ${b} = <b>${d}</b>. ${d} ${d>c?'>':d<c?'<':'='} ${c}, więc to <b>${tr?'prawda':'fałsz'}</b>.`};
  }
  if(t===3){
    const n=R(1000,9999);const ds=String(n).split('');let m=n;
    for(let i=0;i<10&&(m===n);i++){const p=shuffle(ds);if(p[0]!=='0')m=+p.join('')}
    if(m===n)m=n+pick([9,90,-90,900]);
    const sign=pick(['<','>']);const tr=sign==='<'?n<m:n>m;
    return {key:'f3'+n+m+sign,html:`Czy to prawda?<span class="big">${n} ${sign==='<'?'&lt;':'&gt;'} ${m}</span>`,choices:TF,correct:tr?0:1,
      hints:[`Porównuj od lewej: najpierw tysiące, potem setki, dziesiątki, jedności.`,`Znak &lt; to „dzióbek” — otwarta strona patrzy na większą liczbę 🐊`],
      solution:`${n} ${n<m?'&lt;':'&gt;'} ${m}, więc to <b>${tr?'prawda':'fałsz'}</b>.`};
  }
  if(t===4){
    const a=R(11,25),b=R(3,9),p=a*b,c=Math.random()<.5?p:pick([p+10,p-10,p+b,p-b]);const tr=c===p;
    return {key:'f4'+a+b+c,html:`Iloczyn liczb <b>${a}</b> i <b>${b}</b> jest równy <b>${c}</b>.`,choices:TF,correct:tr?0:1,
      hints:[`Iloczyn = wynik mnożenia. Policz ${a} · ${b}.`,`${a} · ${b} = ${Math.floor(a/10)*10}·${b} + ${a%10}·${b} = ${Math.floor(a/10)*10*b} + ${(a%10)*b}`],
      solution:`${a} · ${b} = <b>${p}</b>, więc to <b>${tr?'prawda':'fałsz'}</b>.`};
  }
  const b=R(3,9),q=R(12,40),a=b*q,c=Math.random()<.5?q:pick([q+1,q-1,q+10]);const tr=c===q;
  return {key:'f5'+a+b+c,html:`Iloraz liczb <b>${a}</b> i <b>${b}</b> jest równy <b>${c}</b>.`,choices:TF,correct:tr?0:1,
    hints:[`Iloraz = wynik dzielenia. Sprawdź mnożeniem: ${c} · ${b} = ?`,`${c} · ${b} = ${c*b}. Czy to ${a}?`],
    solution:`${a} : ${b} = <b>${q}</b> (bo ${q}·${b} = ${a}), więc to <b>${tr?'prawda':'fałsz'}</b>.`};
}

/* ================= SEZON 2 — GENERATORY ================= */
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return n===1?f[0]:(b>=2&&b<=4&&(a<12||a>14))?f[1]:f[2]};
const BOX='<span class="qbox">?</span>';
const ORDER='Kolejność: 1) nawiasy 2) potęgi 3) mnożenie i dzielenie (od lewej) 4) dodawanie i odejmowanie (od lewej).';

// 🎢 Kolejność działań
function genKolej(){
  const t=R(1,8);
  const one=(key,expr,ans,hints,solution,bad,badMsg)=>({key,html:`Oblicz:<span class="big">${expr} = ?</span>`,fields:[{label:'Wynik =',ans}],
    hints:[ORDER,...hints],trap:v=>v[0]===ans?null:(bad.includes(v[0])?badMsg:null),solution});
  if(t===1){const a=R(2,40),b=R(3,9),c=R(3,9),ans=a+b*c;
    return one('k1'+a+b+c,`${a} + ${b} · ${c}`,ans,[`Najpierw mnożenie: ${b} · ${c} = ?`,`${b} · ${c} = ${b*c}. Teraz ${a} + ${b*c}.`],
      `${b} · ${c} = ${b*c}, potem ${a} + ${b*c} = <b>${ans}</b>`,[(a+b)*c],`Najpierw mnożenie, potem dodawanie! Ty najpierw dodałaś ${a} + ${b}.`)}
  if(t===2){const b=R(3,9),c=R(3,9),a=b*c+R(5,40),ans=a-b*c;
    return one('k2'+a+b+c,`${a} − ${b} · ${c}`,ans,[`Najpierw mnożenie: ${b} · ${c} = ?`,`${b} · ${c} = ${b*c}. Teraz ${a} − ${b*c}.`],
      `${b} · ${c} = ${b*c}, potem ${a} − ${b*c} = <b>${ans}</b>`,[(a-b)*c],`Najpierw mnożenie, potem odejmowanie!`)}
  if(t===3){const a=R(2,20),b=R(2,20),c=R(3,9),ans=(a+b)*c;
    return one('k3'+a+b+c,`(${a} + ${b}) · ${c}`,ans,[`Nawias jest pierwszy: ${a} + ${b} = ?`,`${a} + ${b} = ${a+b}. Teraz ${a+b} · ${c}.`],
      `${a} + ${b} = ${a+b}, potem ${a+b} · ${c} = <b>${ans}</b>`,[a+b*c],`Nawias zawsze pierwszy! Policz najpierw ${a} + ${b}.`)}
  if(t===4){const c=R(2,9),k=R(2,9),b=c*k,a=k+R(5,60),ans=a-k;
    return one('k4'+a+b+c,`${a} − ${b} : ${c}`,ans,[`Najpierw dzielenie: ${b} : ${c} = ?`,`${b} : ${c} = ${k}. Teraz ${a} − ${k}.`],
      `${b} : ${c} = ${k}, potem ${a} − ${k} = <b>${ans}</b>`,a>b&&(a-b)%c===0?[(a-b)/c]:[],`Najpierw dzielenie, potem odejmowanie!`)}
  if(t===5){const d=R(2,9),b=R(2,20),a=b+d,ans=d*d;
    return one('k5'+a+b,`(${a} − ${b})<sup>2</sup>`,ans,[`Najpierw nawias: ${a} − ${b} = ?`,`${a} − ${b} = ${d}, a ${P(d,2)} = ${d} · ${d}.`],
      `${a} − ${b} = ${d}, potem ${P(d,2)} = ${d} · ${d} = <b>${ans}</b>`,[d*2,a*a-b*b],`Najpierw nawias (${d}), a potem kwadrat: ${d} · ${d}.`)}
  if(t===6){let a,b,c,d;do{a=R(3,9);b=R(3,9);c=R(2,6);d=R(2,6)}while(a*b<=c*d);const ans=a*b-c*d;
    return one('k6'+a+b+c+d,`${a} · ${b} − ${c} · ${d}`,ans,[`Są dwa mnożenia — policz oba: ${a} · ${b} i ${c} · ${d}.`,`${a} · ${b} = ${a*b}, ${c} · ${d} = ${c*d}. Teraz odejmij.`],
      `${a*b} − ${c*d} = <b>${ans}</b>`,[(a*b-c)*d],`Oba mnożenia najpierw, dopiero potem odejmowanie!`)}
  if(t===7){const a=R(2,15),b=R(2,15),c=R(2,6),dd=R(3,(a+b)*c-1),ans=(a+b)*c-dd;
    return one('k7'+a+b+c+dd,`(${a} + ${b}) · ${c} − ${dd}`,ans,[`Krok 1 — nawias: ${a} + ${b} = ${a+b}`,`Krok 2 — mnożenie: ${a+b} · ${c} = ${(a+b)*c}. Krok 3 — odejmij ${dd}.`],
      `${a+b} · ${c} = ${(a+b)*c}, potem ${(a+b)*c} − ${dd} = <b>${ans}</b>`,[a+b*c-dd],`Najpierw nawias, potem mnożenie, na końcu odejmowanie.`)}
  const a=R(12,40),b=R(2,9),c=R(2,9);
  const v=pick([
    [`${a} + ${b} · ${c}`,`${b} · ${c}`,[`${a} + ${b}`]],
    [`(${a} + ${b}) · ${c}`,`${a} + ${b}`,[`${b} · ${c}`]],
    [`${a} − ${b}<sup>2</sup>`,`${P(b,2)}`,[`${a} − ${b}`]],
    [`${a*b} : ${b} · ${c}`,`${a*b} : ${b}`,[`${b} · ${c}`]],
    [`${a} − ${b} + ${c}`,`${a} − ${b}`,[`${b} + ${c}`]],
  ]);
  const m=mc(v[1],v[2]);
  return {key:'k8'+v[0],html:`Co liczysz <b>najpierw</b>?<span class="big">${v[0]}</span>`,...m,
    hints:[ORDER,`Mnożenie i dzielenie są „równie ważne” — wtedy liczysz od lewej. To samo z dodawaniem i odejmowaniem.`],
    solution:`Najpierw: <b>${v[1]}</b>`};
}

// 🏙️ Potęgi Pro
function genPotPro(){
  const t=R(1,6);
  if(t===1){const n=R(2,6),ans=10**n;
    return {key:'pp1'+n,html:`Oblicz:<span class="big">${P(10,n)} = ?</span>`,fields:[{label:`${P(10,n)} =`,ans}],
      hints:[`${P(10,2)} = 10 · 10 = 100, ${P(10,3)} = 1000…`,`Potęga dziesiątki to jedynka i <b>tyle zer, ile wynosi wykładnik</b>: ${n}.`],
      trap:v=>v[0]===10*n?`To jest 10 · ${n}. A ${P(10,n)} to jedynka i ${n} ${zer(n)}!`:null,solution:`${P(10,n)} = 1 i ${n} ${zer(n)} = <b>${fmt(ans)}</b>`}}
  if(t===2){const n=R(11,20),ans=n*n;
    return {key:'pp2'+n,html:`Oblicz:<span class="big">${P(n,2)} = ?</span>`,fields:[{label:`${P(n,2)} =`,ans}],
      hints:[`${P(n,2)} = ${n} · ${n}`,`Rozbij: ${n} · ${n} = ${n} · 10 + ${n} · ${n-10}`,`${n*10} + ${n*(n-10)} = ?`],
      trap:v=>v[0]===2*n?`To ${n} · 2. A ${P(n,2)} = ${n} · ${n}!`:null,solution:`${n} · 10 + ${n} · ${n-10} = ${n*10} + ${n*(n-10)} = <b>${ans}</b>`}}
  if(t===3){const [b,e]=pick([[2,4],[2,5],[2,6],[3,3],[3,4],[4,3],[5,3],[6,3],[2,7],[1,9],[0,5]]),ans=b**e;
    return {key:'pp3'+b+e,html:`Oblicz:<span class="big">${P(b,e)} = ?</span>`,fields:[{label:`${P(b,e)} =`,ans}],
      hints:[`${P(b,e)} = ${Array(e).fill(b).join(' · ')}`,b>1?`Mnóż po kolei: ${Array.from({length:e},(_,i)=>b**(i+1)).slice(0,-1).join(' → ')} → ?`:`${b} pomnożone przez siebie zawsze daje ${b}!`],
      trap:v=>v[0]===b*e&&b*e!==ans?`To ${b} · ${e}. Potęga to mnożenie ${b} przez siebie ${e} razy!`:null,solution:`${Array(e).fill(b).join(' · ')} = <b>${fmt(ans)}</b>`}}
  if(t===4){const [b,e]=pick([[2,5],[2,6],[3,3],[3,4],[10,3],[10,5],[5,3],[4,3],[2,7],[10,6]]),val=b**e;
    return {key:'pp4'+b+e,html:`Jaki jest wykładnik?<span class="big">${b}<sup>?</sup> = ${fmt(val)}</span>`,fields:[{label:'Wykładnik ? =',ans:e}],
      hints:[`Mnóż ${b} · ${b} · ${b}… i licz, ile razy napisałaś ${b}, aż wyjdzie ${fmt(val)}.`,`${Array.from({length:e},(_,i)=>`${P(b,i+1)} = ${fmt(b**(i+1))}`).slice(0,-1).join(', ')}…`],
      trap:v=>v[0]!==e&&v[0]>0&&v[0]<12?`${P(b,v[0])} = ${fmt(b**v[0])}, a potrzebujesz ${fmt(val)}.`:null,solution:`${P(b,e)} = ${fmt(val)}, więc wykładnik to <b>${e}</b>`}}
  if(t===5){const [n,e]=pick([[4,2],[6,2],[7,2],[8,2],[9,2],[11,2],[12,2],[20,2],[30,2],[2,3],[3,3],[4,3],[5,3],[10,3]]),val=n**e;
    return {key:'pp5'+n+e,html:`Jaka liczba pasuje?<span class="big">?<sup>${e}</sup> = ${fmt(val)}</span>`,fields:[{label:'? =',ans:n}],
      hints:[`Szukasz liczby, która pomnożona przez siebie ${e===2?'(2 razy)':'(3 razy)'} da ${fmt(val)}.`,`Próbuj: ${[n-1,n,n+1].filter(x=>x>1&&x!==n).map(x=>`${P(x,e)} = ${fmt(x**e)}`).join(', ')}… a pomiędzy?`],
      trap:v=>v[0]===n?null:(v[0]*e===val?`To ${fmt(val)} : ${e}. A tu szukamy liczby, która razy ona sama da ${fmt(val)}.`:(v[0]>0&&v[0]<=40?`Sprawdź: ${P(v[0],e)} = ${fmt(v[0]**e)}, a ma wyjść ${fmt(val)}.`:null)),
      solution:`${P(n,e)} = ${Array(e).fill(n).join(' · ')} = ${fmt(val)}, więc ? = <b>${n}</b>`}}
  const a=R(2,9),b=R(2,4),ans=a*a+b**3;
  return {key:'pp6'+a+b,html:`Oblicz:<span class="big">${P(a,2)} + ${P(b,3)} = ?</span>`,fields:[{label:'Wynik =',ans}],
    hints:[`Policz każdą potęgę osobno.`,`${P(a,2)} = ${a*a}, ${P(b,3)} = ${b} · ${b} · ${b} = ?`],
    trap:v=>v[0]===2*a+3*b?`Potęgi to nie mnożenie przez wykładnik 😉`:null,solution:`${a*a} + ${b**3} = <b>${ans}</b>`};
}

// 🚌 Reszta w akcji
function genResztaAkcja(){
  const t=R(1,5);
  if(t<=2){
    const bus=t===1;const b=bus?R(8,20):R(4,8),q=R(3,9),r=R(1,b-1),N=b*q+r;
    const html=bus?`Na wycieczkę jedzie <b>${N} uczniów</b>. Do jednego busa wchodzi <b>${b} ${plural(b,['osoba','osoby','osób'])}</b>. Ile busów trzeba zamówić?`
                  :`Na urodziny Amelii przyjdzie <b>${N} gości</b>. Przy jednym stoliku mieszczą się <b>${b} ${plural(b,['osoba','osoby','osób'])}</b>. Ile stolików trzeba przygotować?`;
    const what=bus?'busów':'stolików';
    return {key:'ra'+t+N+b,html,fields:[{label:`Liczba ${what} =`,ans:q+1}],
      hints:[`Podziel z resztą: ${N} : ${b} = ? r ?`,`${N} : ${b} = ${q} r ${r}. Zostaje ${r} ${plural(r,['osoba','osoby','osób'])} — co z ${r===1?'nią':'nimi'}?`],
      trap:v=>v[0]===q?`Prawie! Zostaje ${r} ${plural(r,['osoba','osoby','osób'])} — ${r===1?'ona też musi':'oni też muszą'} się zmieścić. Potrzeba jeszcze jednego!`:null,
      solution:`${N} : ${b} = ${q} r ${r}. ${q} pełnych + 1 dla pozostałych → <b>${q+1}</b>`};
  }
  if(t===3){const b=R(4,9),q=R(3,12),r=R(1,b-1),N=b*q+r;
    return {key:'rb'+N+b,html:`Cukiernia upiekła <b>${N} ${plural(N,['babeczkę','babeczki','babeczek'])}</b>. Do pudełka wchodzi <b>${b}</b>. Ile <b>pełnych</b> pudełek można zapakować?`,fields:[{label:'Pełne pudełka =',ans:q}],
      hints:[`Podziel z resztą: ${N} : ${b} = ? r ?`,`${N} : ${b} = ${q} r ${r}. Pudełko z ${r} ${plural(r,['babeczką','babeczkami','babeczkami'])} nie jest pełne!`],
      trap:v=>v[0]===q+1?`Ostatnie pudełko miałoby tylko ${r} — nie jest pełne, więc go nie liczymy.`:null,
      solution:`${N} : ${b} = ${q} r ${r} → <b>${q}</b> pełnych pudełek (zostaje ${r})`};
  }
  if(t===4){const b=R(15,60),q=R(2,9),r=R(1,b-1),N=b*q+r;
    return {key:'rc'+N+b,html:`Masz <b>${N} ${plural(N,['diament','diamenty','diamentów'])} 💎</b>. Skórka w grze kosztuje <b>${b}</b>. Ile skórek kupisz i ile diamentów zostanie?`,
      fields:[{label:'Skórki =',ans:q},{label:'Zostanie 💎 =',ans:r}],
      hints:[`Ile razy ${b} zmieści się w ${N}?`,`${b} · ${q} = ${b*q}, a ${b} · ${q+1} = ${b*(q+1)} — za dużo!`,`Zostaje: ${N} − ${b*q} = ?`],
      trap:v=>v[1]>=b?`Za ${v[1]} diamentów kupisz jeszcze jedną skórkę! Reszta musi być mniejsza niż ${b}.`:(v[0]*b+v[1]!==N?`Sprawdź: ${v[0]} · ${b} + ${v[1]} = ${v[0]*b+v[1]}, a masz ${N}.`:null),
      solution:`${N} : ${b} = ${q} r ${r} → <b>${q} skórki/skórek</b>, zostaje <b>${r} 💎</b>`.replace(' skórki/skórek',' '+plural(q,['skórka','skórki','skórek']))};
  }
  const k=R(3,6),q=R(3,12),r=R(1,k-1),N=k*q+r;
  return {key:'rd'+N+k,html:`<b>${N} ${plural(N,['naklejkę','naklejki','naklejek'])}</b> dzielimy po równo między <b>${k} ${plural(k,['przyjaciółkę','przyjaciółki','przyjaciółek'])}</b>. Ile dostanie każda i ile zostanie?`,
    fields:[{label:'Każda dostanie =',ans:q},{label:'Zostanie =',ans:r}],
    hints:[`Podziel z resztą: ${N} : ${k}`,multTable(k,N)],
    trap:v=>v[1]>=k?`Zostało ${v[1]} — to wystarczy, żeby każda dostała jeszcze po jednej! Reszta < ${k}.`:null,
    solution:`${N} : ${k} = ${q} r ${r} → każda <b>${q}</b>, zostaje <b>${r}</b>`};
}

// ⚖️ O ile? Ile razy?
const ITEMS=[['naklejka','naklejki','naklejek'],['diament','diamenty','diamentów'],['lajk','lajki','lajków'],['karta','karty','kart'],['muszelka','muszelki','muszelek'],['subskrybent','subskrybentów','subskrybentów']];
function genIleRazy(){
  const [n1,n2]=shuffle(NAMES).slice(0,2),it=pick(ITEMS),f=n=>`${n} ${plural(n,it)}`;
  const t=R(1,5);
  const b=R(3,12),k=R(2,6),a=b*k;
  if(t===1)return {key:'ir1'+a+b,html:`${n1} ma <b>${f(a)}</b>, a ${n2} ma <b>${f(b)}</b>.`,
    fields:[{label:`O ile więcej ma ${n1}?`,ans:a-b},{label:`Ile razy więcej ma ${n1}?`,ans:k}],
    hints:[`„O ile?” → odejmowanie. „Ile razy?” → dzielenie.`,`${a} − ${b} = ? &nbsp; i &nbsp; ${a} : ${b} = ?`],
    trap:v=>v[0]===k&&v[1]===a-b?`Zamieniłaś! „O ile” to odejmowanie (${a} − ${b}), a „ile razy” to dzielenie (${a} : ${b}).`:(v[0]===a+b?`„O ile więcej” to odejmowanie, nie dodawanie.`:(v[1]===a-b?`„Ile razy” to dzielenie: ${a} : ${b}.`:null)),
    solution:`O ile: ${a} − ${b} = <b>${a-b}</b>. Ile razy: ${a} : ${b} = <b>${k}</b>.`};
  if(t===2){const d=R(5,40),m=R(10,60);const more=Math.random()<.5;
    if(more)return {key:'ir2'+m+d,html:`${n1} ma ${f(m)}. ${n2} ma o <b>${d} więcej</b>. Ile ma ${n2}?`,fields:[{label:`${n2} ma`,ans:m+d}],
      hints:[`„O ${d} więcej” → dodaj ${d}.`],trap:v=>v[0]===m-d?`„Więcej” → dodawanie: ${m} + ${d}.`:(v[0]===m*d?`„O ile” to dodawanie, nie mnożenie.`:null),solution:`${m} + ${d} = <b>${m+d}</b>`};
    const mm=m+d;return {key:'ir3'+mm+d,html:`${n1} ma ${f(mm)}. ${n2} ma o <b>${d} mniej</b>. Ile ma ${n2}?`,fields:[{label:`${n2} ma`,ans:mm-d}],
      hints:[`„O ${d} mniej” → odejmij ${d}.`],trap:v=>v[0]===mm+d?`„Mniej” → odejmowanie: ${mm} − ${d}.`:null,solution:`${mm} − ${d} = <b>${mm-d}</b>`};}
  if(t===3)return {key:'ir4'+b+k,html:`${n1} ma ${f(b)}. ${n2} ma <b>${k} razy więcej</b>. Ile ma ${n2}?`,fields:[{label:`${n2} ma`,ans:a}],
    hints:[`„${k} razy więcej” → pomnóż przez ${k}.`],trap:v=>v[0]===b+k?`„Razy” → mnożenie: ${b} · ${k}, a nie ${b} + ${k}.`:null,solution:`${b} · ${k} = <b>${a}</b>`};
  if(t===4)return {key:'ir5'+a+k,html:`${n1} ma ${f(a)}. ${n2} ma <b>${k} razy mniej</b>. Ile ma ${n2}?`,fields:[{label:`${n2} ma`,ans:b}],
    hints:[`„${k} razy mniej” → podziel przez ${k}.`],trap:v=>v[0]===a-k?`„Razy mniej” → dzielenie: ${a} : ${k}, a nie ${a} − ${k}.`:null,solution:`${a} : ${k} = <b>${b}</b>`};
  const cOk=Math.random()<.5?`${n1} ma o ${a-b} więcej`:`${n1} ma ${k} razy więcej`;
  const m=mc(cOk,shuffle([`${n1} ma o ${k} więcej`,`${n1} ma ${a-b} razy więcej`,`${n1} ma o ${a+b} więcej`]).slice(0,2));
  return {key:'ir6'+a+b+cOk.length,html:`${n1} ma <b>${f(a)}</b>, a ${n2} ma <b>${f(b)}</b>. Które zdanie jest prawdziwe?`,...m,
    hints:[`Policz: ${a} − ${b} = ${a-b} („o ile”) oraz ${a} : ${b} = ${k} („ile razy”).`],solution:`<b>${cOk}</b> (${a} − ${b} = ${a-b}, ${a} : ${b} = ${k})`};
}

// 🔍 Detektyw podzielności
const DRULE={2:'ostatnia cyfra jest parzysta (0, 2, 4, 6, 8)',5:'ostatnia cyfra to 0 albo 5',10:'ostatnia cyfra to 0',3:'suma cyfr dzieli się przez 3',9:'suma cyfr dzieli się przez 9'};
const dsum=n=>String(n).split('').reduce((s,c)=>s+ +c,0);
function genPodziel(){
  const t=R(1,4),d=pick([2,5,10,3,9,3,9]);
  const multOf=()=>{let x;do{x=R(100,9999)}while(x%d);return x};
  const notOf=()=>{let x;do{x=R(100,9999);if(d===9&&Math.random()<.6)x=x-x%3}while(x%d===0||x<100);return x};
  if(t===1){const c=multOf();const ws=[];while(ws.length<3){const w=notOf();if(!ws.includes(w))ws.push(w)}
    const m=mc(String(c),ws.map(String));
    return {key:'d1'+c+d,html:`Która liczba jest podzielna przez <b>${d}</b>?`,...m,
      hints:[`Cecha podzielności przez ${d}: ${DRULE[d]}.`,d===3||d===9?`Policz sumę cyfr każdej liczby, np. ${ws[0]}: ${String(ws[0]).split('').join(' + ')} = ${dsum(ws[0])}.`:`Patrz tylko na ostatnią cyfrę!`],
      trap:(v,ch)=>ch!==m.correct&&d===9&&+m.choices[ch]%3===0?`Ta liczba dzieli się przez 3, ale nie przez 9 — suma cyfr ${dsum(+m.choices[ch])} nie dzieli się przez 9.`:null,
      solution:`<b>${c}</b> — ${d===3||d===9?`suma cyfr ${dsum(c)} dzieli się przez ${d}`:DRULE[d]}`}}
  if(t===2){const tr=Math.random()<.5,N=tr?multOf():notOf();
    return {key:'d2'+N+d,html:`Liczba <b>${N}</b> jest podzielna przez <b>${d}</b>.`,choices:['Prawda ✅','Fałsz ❌'],correct:tr?0:1,
      hints:[`Cecha podzielności przez ${d}: ${DRULE[d]}.`,d===3||d===9?`Suma cyfr: ${String(N).split('').join(' + ')} = ${dsum(N)}`:`Ostatnia cyfra: ${N%10}`],
      solution:`${d===3||d===9?`Suma cyfr = ${dsum(N)}`:`Ostatnia cyfra = ${N%10}`} → <b>${tr?'prawda':'fałsz'}</b>`}}
  if(t===3){const dd=pick([3,9]);let pre,post,valid;
    do{pre=R(1,99);post=R(0,99);valid=[...Array(10).keys()].filter(x=>(dsum(pre)+x+dsum(post))%dd===0)}while(!valid.length||valid.length>4);
    const ok=pick(valid),wr=shuffle([...Array(10).keys()].filter(x=>!valid.includes(x))).slice(0,3);
    const m=mc(String(ok),wr.map(String));const shown=`${pre}<span class="qbox">?</span>${String(post).padStart(2,'0')}`;
    return {key:'d3'+pre+post+dd,html:`Jaką cyfrę wstawić, żeby liczba dzieliła się przez <b>${dd}</b>?<span class="big">${shown}</span>`,...m,
      hints:[`Przez ${dd}: ${DRULE[dd]}.`,`Suma znanych cyfr: ${dsum(pre)+dsum(post)}. Ile trzeba dodać, żeby dzieliło się przez ${dd}?`],
      solution:`${dsum(pre)+dsum(post)} + ${ok} = ${dsum(pre)+dsum(post)+ok} — dzieli się przez ${dd} → <b>${ok}</b>`}}
  const dd=pick([3,9]),tr=Math.random()<.5;let N;do{N=R(1000,99999)}while((N%dd===0)!==tr);
  return {key:'d4'+N+dd,html:`Sprawdź liczbę <b>${fmt(N)}</b>.`,fields:[{label:'Suma cyfr =',ans:dsum(N)}],
    choiceLabel:`Czy dzieli się przez ${dd}?`,choices:['Tak ✅','Nie ❌'],correct:tr?0:1,
    hints:[`Dodaj wszystkie cyfry: ${String(N).split('').join(' + ')}`,`Przez ${dd}: ${DRULE[dd]}.`],
    trap:(v,c)=>v[0]===dsum(N)&&c!==(tr?0:1)?`Suma ${dsum(N)} jest dobra! Czy ${dsum(N)} dzieli się przez ${dd}?`:null,
    solution:`Suma cyfr = ${dsum(N)} → ${tr?'dzieli się':'nie dzieli się'} przez ${dd} → <b>${tr?'Tak':'Nie'}</b>`};
}

// 🧩 Tajemnicze okienko
function genOkienko(){
  const t=R(1,6);
  const box=(key,html,ans,hints,check,solution)=>({key,html:`Jaka liczba kryje się w okienku?<span class="big">${html}</span>`,fields:[{label:'? =',ans}],hints,
    trap:v=>v[0]===ans?null:check(v[0]),solution});
  if(t<=3){const d=R(2,9),k=R(0,2),e=R(2,9),m=R(0,2),b=d*10**k,x=e*10**m,c=x*b;
    if(t===1)return box('o1'+b+c,`${BOX} · ${fmt(b)} = ${fmt(c)}`,x,[`Odwrotne działanie: ? = ${fmt(c)} : ${fmt(b)}`,`Zamroź zera ❄️ i podziel.`],
      v=>`Sprawdź: ${fmt(v)} · ${fmt(b)} = ${fmt(v*b)}, a ma wyjść ${fmt(c)}.`,`${fmt(c)} : ${fmt(b)} = <b>${fmt(x)}</b> (bo ${fmt(x)} · ${fmt(b)} = ${fmt(c)})`);
    if(t===2)return box('o2'+c+x,`${fmt(c)} : ${BOX} = ${fmt(x)}`,b,[`Odwrotne działanie: ? = ${fmt(c)} : ${fmt(x)}`,`Sprawdzaj mnożeniem: ? · ${fmt(x)} = ${fmt(c)}`],
      v=>`Sprawdź: ${fmt(v)} · ${fmt(x)} = ${fmt(v*x)}, a powinno być ${fmt(c)}.`,`${fmt(c)} : ${fmt(x)} = <b>${fmt(b)}</b>`);
    return box('o3'+b+x,`${BOX} : ${fmt(b)} = ${fmt(x)}`,c,[`Odwrotnością dzielenia jest mnożenie: ? = ${fmt(x)} · ${fmt(b)}`],
      v=>`Sprawdź: ${fmt(x)} · ${fmt(b)} = ? To jest liczba w okienku.`,`${fmt(x)} · ${fmt(b)} = <b>${fmt(c)}</b>`);}
  const b=R(120,980),c=R(200,2500);
  if(t===4)return box('o4'+b+c,`${BOX} − ${b} = ${fmt(c)}`,b+c,[`Odwrotnością odejmowania jest dodawanie: ? = ${fmt(c)} + ${b}`],
    v=>v===c-b?`Odwrotnie do odejmowania jest DODAWANIE: ${fmt(c)} + ${b}.`:`Sprawdź: ${fmt(v)} − ${b} = ${fmt(v-b)}, a ma wyjść ${fmt(c)}.`,`${fmt(c)} + ${b} = <b>${fmt(b+c)}</b>`);
  if(t===5){const a=b+c;return box('o5'+a+c,`${fmt(a)} − ${BOX} = ${fmt(c)}`,b,[`Ile trzeba odjąć od ${fmt(a)}, żeby zostało ${fmt(c)}? ? = ${fmt(a)} − ${fmt(c)}`],
    v=>v===a+c?`Tu odejmujesz: ${fmt(a)} − ${fmt(c)}.`:`Sprawdź: ${fmt(a)} − ${fmt(v)} = ${fmt(a-v)}, a ma wyjść ${fmt(c)}.`,`${fmt(a)} − ${fmt(c)} = <b>${b}</b>`)}
  const s=b+c;return box('o6'+b+s,`${BOX} + ${b} = ${fmt(s)}`,c,[`Odwrotnością dodawania jest odejmowanie: ? = ${fmt(s)} − ${b}`],
    v=>v===s+b?`Odwrotnie do dodawania jest ODEJMOWANIE: ${fmt(s)} − ${b}.`:`Sprawdź: ${fmt(v)} + ${b} = ${fmt(v+b)}, a ma wyjść ${fmt(s)}.`,`${fmt(s)} − ${b} = <b>${fmt(c)}</b>`);
}

const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const plDate=s=>s?s.split('-').reverse().join('.'):'—';
function stat(id){return S.stats[id]=S.stats[id]||{rounds:0,q:0,first:0,wrong:0,hints:0,sols:0,last:''}}
function toText(h){const SUP={0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹','?':'ˀ'};
  h=String(h).replace(/<sup>([^<]*)<\/sup>/g,(m,x)=>[...x].map(c=>SUP[c]||c).join('')).replace(/<br\s*\/?>/g,' ');
  const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()}
function ansText(q,vals,choice){const p=(q.fields||[]).map((f,i)=>`${toText(f.label)} ${vals[i]===''?'?':fmt(vals[i])}`);if(q.choices&&choice!=null)p.push(toText(q.choices[choice]));return p.join(' · ')}
function okText(q){const p=(q.fields||[]).map(f=>`${toText(f.label)} ${fmt(f.ans)}`);if(q.choices)p.push(toText(q.choices[q.correct]));return p.join(' · ')}

   </div>

   <h3 class="ph">Zadania, które sprawiły kłopot</h3>

function startRun(id){
  const w=W(id);
  run={w,n:w.gen?8:12,i:0,perfect:0,coins:0,res:[],seen:new Set(),hTot:0,sTot:0};
  newQ();
}
function newQ(){
  let gen=run.w.gen,from=null;
  let q;
  for(let t=0;t<20;t++){
    if(!run.w.gen){from=pick(WORLDS.filter(x=>x.gen&&seasonOf(x)===seasonOf(run.w)));gen=from.gen}
    q=gen();if(!run.seen.has(q.key))break;
  }
  run.seen.add(q.key);q.from=from;
  Object.assign(run,{q,vals:(q.fields||[]).map(()=>''),active:0,choice:null,attempts:0,hintN:0,sol:false,answered:false,firstWrong:null});
  renderPlay();
}
function trackHtml(){
  let h='<div class="track">';
  for(let i=0;i<run.n;i++){
    const st=run.res[i];const cls=st===true?'done':st===false?'miss':(i===run.i?'cur':'');
    h+=`<div class="blk ${cls}">${i===Math.min(run.i,run.n-1)?`<span class="me">${S.avatar}</span>`:''}</div>`;
  }
  return h+'<span class="flag">🏁</span></div>';
}
function renderPlay(){
  const w=run.w,q=run.q,hasF=(q.fields||[]).length>0;
  app.innerHTML=`<div class="play" style="--wc:${(q.from||w).c1};--wc2:${(q.from||w).c2}">

   <div class="scroll" id="scroll"><div class="card">
     <div class="qnum"><span>Zadanie ${run.i+1} z ${run.n}</span>${q.from?`<span class="tag">${q.from.emoji} ${q.from.name}</span>`:`<span class="pill" style="background:#f1ebff;color:#6d28d9;padding:3px 9px">💎 ${S.coins}</span>`}</div>
     <div class="qtext">${q.html}</div>
     <div id="widget"></div>
     ${(q.fields||[]).map((f,i)=>`<div class="frow"><span class="flabel">${f.label}</span><div class="field" id="f${i}" onclick="focusF(${i})"><span class="fv"></span></div>${f.unit?`<span class="unit">${f.unit}</span>`:''}</div>`).join('')}
     ${q.choices?`${q.choiceLabel?`<div class="clabel">${q.choiceLabel}</div>`:''}<div class="choices ${q.choices.length===2?'two':''}">${q.choices.map((c,i)=>`<button class="choice" data-c="${i}" onclick="choose(${i})">${c}</button>`).join('')}</div>`:''}
     <div id="fb" class="fb"></div>
     <div id="hints"></div>

   <div class="bottom">
     <div class="actions"><button class="btn hb" id="hb" onclick="hint()">💡 Podpowiedź</button><button class="btn go" id="go" onclick="check()">Sprawdź ✓</button></div>
     ${hasF?`<div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="key('${n}')">${n}</button>`).join('')}<button class="key fn" onclick="key('back')">⌫</button><button class="key" onclick="key('0')">0</button><button class="key fn" onclick="key('next')">↵</button></div>`:''}
   </div></div>`;
  if(q.widget?.type==='zeros')wZeros(q.widget);

function snakeTask(){
  const t=R(1,9);
  if(t===1){const a=R(3,12),b=R(3,12);return {t:`${a} · ${b} = ?`,a:a*b,h:`${a} · ${b} = ${a} · ${b-1} + ${a} = ${a*(b-1)} + ${a}`}}
  if(t===2){const a=R(2,20);return {t:`${P(a,2)} = ?`,a:a*a,h:`${P(a,2)} = ${a} · ${a} (nie ${a} · 2!)`}}
  if(t===3){const a=R(2,9);return {t:`${P(a,3)} = ?`,a:a**3,h:`${P(a,3)} = ${a} · ${a} · ${a} = ${a*a} · ${a}`}}
  if(t===4){const d=R(2,9),e=R(2,9),k=R(1,2),m=R(0,1),B=d*10**k,q=e*10**m,A=B*q;
    return {t:`${fmt(A)} : ${fmt(B)} = ?`,a:q,h:`Zamroź ${k} ${zer(k)} ❄️ w obu liczbach: ${fmt(A/10**k)} : ${d}`}}
  if(t===5){const a=R(2,40),b=R(2,9),c=R(2,9);return {t:`${a} + ${b} · ${c} = ?`,a:a+b*c,h:`Najpierw mnożenie: ${b} · ${c} = ${b*c}`}}
  if(t===6){const a=R(2,15),b=R(2,15),c=R(2,6);return {t:`(${a} + ${b}) · ${c} = ?`,a:(a+b)*c,h:`Najpierw nawias: ${a} + ${b} = ${a+b}`}}
  if(t===7){const b=R(4,9),q=R(3,11),r=R(1,b-1),N=b*q+r;return {t:`<span class="sl">Reszta z dzielenia</span>${N} : ${b} = ${q} r ?`,a:r,h:`${b} · ${q} = ${b*q}, zostaje ${N} − ${b*q}`}}
  if(t===8){const b=R(3,9),x=R(3,12);return {t:`${BOX} · ${b} = ${b*x}`,a:x,h:`? = ${b*x} : ${b}`}}
  const [p,q]=pick([[4,25],[2,50],[5,20]]),x=R(2,9);return {t:`${p} · ${x} · ${q} = ?`,a:p*q*x,h:`Sprytnie: ${p} · ${q} = ${p*q}, potem · ${x}`};
}

function snakeStart(fast){
  const tasks=[],used=new Set();let n=0;
  while(tasks.length<8&&n++<1000){const t=snakeTask();if(!used.has(t.a)){used.add(t.a);tasks.push(t)}}
  app.innerHTML=`<div class="play snake" style="--wc:${SNAKE_W.c1};--wc2:${SNAKE_W.c2}">
   <div class="ptop"><button class="iconbtn" onclick="snakeQuit()">✕</button><div class="ptitle">🐍 Matma Wąż</div><div class="hearts" id="hearts"></div></div>
   <div class="card stask"><div class="sq" id="sq"></div><div class="stext" id="stext"></div><div class="shint" id="shint"></div></div>
   <div class="sboard" id="sboard"><canvas id="cv"></canvas><div class="sover" id="sover">Przesuń palcem albo stuknij strzałkę, żeby ruszyć ▶</div></div>
   <div class="dpad">
    <button class="dk fn" onclick="snakeHint()">💡</button><button class="dk" onclick="snakeDir(0,-1)">▲</button><button class="dk fn" id="pz" onclick="snakePause()">⏸</button>
    <button class="dk" onclick="snakeDir(-1,0)">◀</button><button class="dk" onclick="snakeDir(0,1)">▼</button><button class="dk" onclick="snakeDir(1,0)">▶</button>
   </div></div>`;
  const wrap=$('sboard'),cv=$('cv');
  const COLS=11,cw=wrap.clientWidth-24,ch=wrap.clientHeight-16;
  const cell=Math.max(20,Math.floor(Math.min(cw/COLS,ch/10)));
  const ROWS=Math.max(10,Math.min(17,Math.floor(ch/cell)));
  const ctx=cv.getContext('2d');
  const sy=Math.floor(ROWS/2);
  const g={fast,tasks,i:0,COLS,ROWS,cell,ctx,body:[{x:3,y:sy},{x:2,y:sy},{x:1,y:sy}],dir:[1,0],queue:[],grow:0,hearts:3,tiles:[],
    started:false,paused:false,over:false,freeze:0,acc:0,last:0,step:fast?175:280,pops:[],t0:0,
    wrongThis:false,hintsThis:0,hintsTot:0,firstOk:0};
  // rozmieszczenie liczb: nie na wężu, nie w rzędzie startowym, z odstępem między sobą
  const busy=(x,y)=>(y===sy&&x<8)||g.tiles.some(o=>o.x===x&&o.y===y);
  const near=(x,y)=>g.tiles.some(o=>Math.abs(o.x-x)<=1&&Math.abs(o.y-y)<=1);
  for(const t of tasks){
    let x,y,k=0;
    do{x=R(0,COLS-1);y=R(0,ROWS-1);k++}while(busy(x,y)||(k<300&&near(x,y)));
    g.tiles.push({x,y,v:t.a,flash:0,col:TILECOLS[g.tiles.length%TILECOLS.length]});
  }
  // plansza dopasowuje się, gdy karta zadania urośnie (dwie linijki, podpowiedź) albo zmieni się ekran
  const fit=()=>{const w=wrap.clientWidth-24,h=wrap.clientHeight-16;if(w<50||h<50)return;
    const c=Math.max(14,Math.floor(Math.min(w/COLS,h/ROWS)));if(c===g.fitC)return;g.fitC=c;g.cell=c;
    const dpr=window.devicePixelRatio||1;cv.width=COLS*c*dpr;cv.height=ROWS*c*dpr;cv.style.width=COLS*c+'px';cv.style.height=ROWS*c+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0)};
  SN=g;
  snakeHearts();snakeShowTask(g);fit();
  if(window.ResizeObserver)new ResizeObserver(fit).observe(wrap);else addEventListener('resize',fit);
  let sx=0,sy2=0;
  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy2=t.clientY},{passive:true});
  wrap.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  wrap.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy2;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    Math.abs(dx)>Math.abs(dy)?snakeDir(Math.sign(dx),0):snakeDir(0,Math.sign(dy))});
  requestAnimationFrame(ts=>snakeLoop(g,ts));
}
function snakeHearts(){const g=SN;if(g)$('hearts').textContent='❤️'.repeat(g.hearts)+'🤍'.repeat(3-g.hearts)}
function snakeShowTask(g){
  $('sq').textContent=`Zadanie ${g.i+1} z ${g.tasks.length} · zostało liczb: ${g.tiles.length}`;
  const el=$('stext');el.innerHTML=g.tasks[g.i].t;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
  $('shint').innerHTML='';
}
function snakeDir(dx,dy){
  const g=SN;if(!g||g.over)return;
  const last=g.queue.length?g.queue[g.queue.length-1]:g.dir;
  const reverse=last[0]===-dx&&last[1]===-dy;
  if(!reverse&&!(last[0]===dx&&last[1]===dy)&&g.queue.length<3)g.queue.push([dx,dy]);
  if(!g.started){g.started=true;g.t0=performance.now();$('sover').style.display='none'}
  if(g.paused)snakePause();
}
function snakePause(){
  const g=SN;if(!g||g.over||!g.started)return;
  g.paused=!g.paused;$('pz').textContent=g.paused?'▶':'⏸';
  const o=$('sover');o.style.display=g.paused?'block':'none';o.textContent='Pauza ⏸ — stuknij strzałkę albo ▶, żeby grać dalej';
}
function snakeHint(){
  const g=SN;if(!g||g.over)return;
  const el=$('shint');if(el.innerHTML)return;
  el.innerHTML='💡 '+g.tasks[g.i].h;g.hintsThis++;g.hintsTot++;tone([880,1100],.07);
}
function snakeQuit(){
  const g=SN;if(g&&g.started&&!g.over){const was=g.paused;g.paused=true;if(!confirm('Wyjść z gry? Ta runda przepadnie.')){g.paused=was;return}}
  SN=null;home();
}
function snakeLoop(g,ts){
  if(SN!==g)return;
  const dt=Math.min(ts-(g.last||ts),100);g.last=ts;
  if(g.started&&!g.paused&&!g.over&&ts>g.freeze){g.acc+=dt;while(g.acc>=g.step&&!g.over){g.acc-=g.step;snakeStep(g,ts)}}
  snakeDraw(g,ts);
  requestAnimationFrame(t=>snakeLoop(g,t));
}
function snakeMsg(txt,bad){
  document.querySelectorAll('.smsg').forEach(m=>m.remove());
  const m=document.createElement('div');m.className='smsg'+(bad?'':' ok');m.innerHTML=txt;$('sboard').appendChild(m);setTimeout(()=>m.remove(),1400);
}
function snakeLose(g,ts,why){
  g.hearts--;snakeHearts();sBad();g.freeze=ts+800;g.queue=[];
  snakeMsg(why+(g.hearts?` −1 ❤️`:''),true);
  if(g.hearts<=0){g.over=true;setTimeout(()=>snakeEnd(g,false),1000)}
}
function snakeStep(g,ts){
  if(g.queue.length)g.dir=g.queue.shift();
  const h=g.body[0],nx=(h.x+g.dir[0]+g.COLS)%g.COLS,ny=(h.y+g.dir[1]+g.ROWS)%g.ROWS;
  const idx=g.body.findIndex(s=>s.x===nx&&s.y===ny);
  if(idx>=0&&!(idx===g.body.length-1&&g.grow===0)){
    g.body=g.body.slice(0,Math.max(idx,2));
    snakeLose(g,ts,'Ugryzłaś ogon! 🐍');if(g.over)return;
  }
  g.body.unshift({x:nx,y:ny});
  const ti=g.tiles.findIndex(t=>t.x===nx&&t.y===ny);
  if(ti>=0){
    const t=g.tiles[ti],task=g.tasks[g.i];
    if(t.v===task.a){
      g.tiles.splice(ti,1);g.grow+=2;
      const s=stat('snake');s.q++;if(!g.wrongThis){s.first++;g.firstOk++}s.hints+=g.hintsThis;s.last=today();
      const gain=g.wrongThis?3:5;S.coins+=gain;S.solved++;save();
      sOk();g.pops.push({x:nx,y:ny,txt:`+${gain} 💎`,t:ts});
      g.i++;g.wrongThis=false;g.hintsThis=0;
      if(g.i>=g.tasks.length){g.over=true;setTimeout(()=>snakeEnd(g,true),600);return}
      snakeMsg(pick(['Mniam! 😋','Mega! 🔥','Brawo! ⭐','Petarda! 💥','Kozacko! 😎']));
      snakeShowTask(g);
    }else{
      t.flash=ts;
      if(!g.wrongThis){S.trouble.unshift({d:today(),w:'snake',q:toText(task.t),bad:fmt(t.v),ok:fmt(task.a),sol:false,hints:g.hintsThis});S.trouble=S.trouble.slice(0,40)}
      g.wrongThis=true;stat('snake').wrong++;save();
      snakeLose(g,ts,`${fmt(t.v)} to nie ten wynik!`);
      if(g.over)return;
    }
  }
  if(g.grow>0)g.grow--;else g.body.pop();
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function snakeDraw(g,ts){
  const {ctx,cell:c,COLS,ROWS}=g;
  ctx.fillStyle='#ecfdf5';ctx.fillRect(0,0,COLS*c,ROWS*c);
  ctx.fillStyle='#d1fae5';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if((x+y)%2)ctx.fillRect(x*c,y*c,c,c);
  // liczby
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of g.tiles){
    const age=ts-t.flash,fl=t.flash&&age<700,ox=fl?Math.sin(age/25)*4*(1-age/700):0;
    ctx.fillStyle=fl?'#fb7185':t.col;rr(ctx,t.x*c+2+ox,t.y*c+2,c-4,c-4,c*.28);ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(30,27,75,.18)';ctx.stroke();
    const s=String(t.v),fs=s.length>=3?c*.36:s.length===2?c*.46:c*.54;
    ctx.fillStyle='#1e1b4b';ctx.font=`900 ${fs}px ui-rounded,"SF Pro Rounded",system-ui,sans-serif`;ctx.fillText(s,t.x*c+c/2+ox,t.y*c+c/2+1);
  }
  // wąż
  const n=g.body.length;
  for(let i=n-1;i>=0;i--){
    const s=g.body[i],k=n>1?i/(n-1):0,pad=i===0?1:2+k*2;
    ctx.fillStyle=i===0?'#15803d':`hsl(${142-k*10},${70-k*15}%,${38+k*25}%)`;
    rr(ctx,s.x*c+pad,s.y*c+pad,c-2*pad,c-2*pad,c*.35);ctx.fill();
  }
  // oczy
  const h=g.body[0],[dx,dy]=g.dir,cx=h.x*c+c/2,cy=h.y*c+c/2;
  for(const side of [-1,1]){
    const ex=cx+dx*c*.15+(dy?side*c*.2:0),ey=cy+dy*c*.15+(dx?side*c*.2:0);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,c*.14,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+dx*c*.05,ey+dy*c*.05,c*.07,0,7);ctx.fill();
  }
  // „+5 💎”
  g.pops=g.pops.filter(p=>ts-p.t<900);
  for(const p of g.pops){const a=(ts-p.t)/900;ctx.globalAlpha=1-a;ctx.fillStyle='#15803d';ctx.font=`900 ${c*.5}px ui-rounded,system-ui,sans-serif`;
    ctx.fillText(p.txt,p.x*c+c/2,p.y*c+c/2-a*c*1.2);ctx.globalAlpha=1}
}
function snakeEnd(g,won){
  if(SN!==g)return;
  const secs=Math.round((performance.now()-g.t0)/1000),st=won?g.hearts:0;
  const prev=S.stars.snake||0;if(st>prev)S.stars.snake=st;
  const bonus=st*10;S.coins+=bonus;
  const s=stat('snake');s.rounds++;s.last=today();
  S.log.unshift({d:today(),w:'snake',p:g.firstOk,n:g.tasks.length,st,h:g.hintsTot,s:0});S.log=S.log.slice(0,40);
  let rec=false;
  if(won){S.snakeBest=S.snakeBest||{};const k=g.fast?'f':'s';if(!S.snakeBest[k]||secs<S.snakeBest[k]){rec=true;S.snakeBest[k]=secs}}
  save();SN=null;
  if(won){sWin();confetti(['🐍','⭐','💎','🍏']);setTimeout(()=>confetti(['⭐','🏆']),900)}
  app.innerHTML=`<div class="res" style="--wc:${SNAKE_W.c1};--wc2:${SNAKE_W.c2}">
   <div style="font-size:60px">${won?'🐍':'😵'}</div><h2>${won?(st===3?'Wąż-mistrzyni! 🏆':'Wszystkie zebrane! 🎉'):'Oof! Koniec serc'}</h2>
   ${won?`<div class="bigstars">${starStr(st)}</div>`:''}
   <div style="font-weight:800">Zebrane liczby: ${g.i} z ${g.tasks.length}${won?` · czas ${mmss(secs)}`:''} · bonus 💎 ${bonus}</div>
   <div class="card">🧚 ${won?(rec?`Nowy rekord (${g.fast?'🐇 szybko':'🐢 spokojnie'}): <b>${mmss(secs)}</b>! `:'')+(st===3?'Ani jednej pomyłki — perfekcyjnie!':'Spróbuj jeszcze raz bez utraty serca, żeby zdobyć 3 gwiazdki!'):'Nic się nie stało! Liczby i zadania będą nowe — spróbuj jeszcze raz 💪'}</div>
   <div class="row"><button class="bigbtn alt" onclick="home()">🗺️ Mapa</button><button class="bigbtn" onclick="snakeStart(${g.fast})">🔁 Jeszcze raz</button></div></div>`;
  scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!SN)return;
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();snakeDir(...m)}else if(e.key===' '){e.preventDefault();snakePause()}
});

/* ================= WIDŻETY ================= */
function wZeros(wd){
  const el=$('widget');let c=0;
  const tz=n=>{const s=String(n);let k=0;for(let i=s.length-1;i>0&&s[i]==='0';i--)k++;return k};
  const max=Math.min(tz(wd.a),tz(wd.b));
  const dig=n=>{const s=String(n);return [...s].map((ch,i)=>`<span class="dg ${i>=s.length-c?'frozen':''}">${ch}</span>`).join('')};
  function draw(){
    el.innerHTML=`<div class="wbox"><div class="wlabel">Lodowa maszyna ❄️</div><div class="zrow"><span>${dig(wd.a)}</span><span>:</span><span>${dig(wd.b)}</span></div>
     ${c?`<div class="znote">Zostaje: <b>${fmt(wd.a/10**c)} : ${fmt(wd.b/10**c)}</b></div>`:''}
     <button class="mini" id="frz">❄️ Zamroź parę zer</button>${c?'<button class="mini ghost" id="unf">↺</button>':''}</div>`;
    $('frz').onclick=()=>{if(c<max){c++;sMagic();draw()}else{sBad();toast(c?'Brak kolejnej pary zer — teraz podziel! ✨':'Brak pary zer do zamrożenia')}};
    if(c)$('unf').onclick=()=>{c=0;sTap();draw()};
  }
  draw();
}
function wPairs(wd){
  const el=$('widget');let chips,sel,msg;
  const reset=()=>{chips=wd.factors.map(v=>({v,gold:false}));sel=[];msg=''};reset();
  const ROUND=[10,100,200,1000];
  function draw(){
    el.innerHTML=`<div class="wbox"><div class="wlabel">Stuknij dwie liczby-przyjaciółki 🤝</div><div class="chips">${chips.map((c,i)=>`<button class="chip ${c.gold?'gold':''} ${sel.includes(i)?'sel':''}" data-i="${i}">${fmt(c.v)}</button>`).join('<span class="dot">·</span>')}</div>
     <div class="wmsg">${msg}</div><button class="mini ghost" id="prs">↺ od nowa</button></div>`;
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>tapChip(+b.dataset.i,b));
    $('prs').onclick=()=>{reset();sTap();draw()};
  }
  function tapChip(i,b){
    if(chips[i].gold){msg=`Super! Teraz policz w głowie: ${chips.map(c=>fmt(c.v)).join(' · ')} ✨`;sTap();draw();return}
    if(sel.includes(i)){sel=sel.filter(x=>x!==i);sTap();draw();return}
    sel.push(i);sTap();
    if(sel.length<2)return draw();
    const [x,y]=sel,p=chips[x].v*chips[y].v;
    if(ROUND.includes(p)){
      const keep=chips.filter((_,k)=>k!==x&&k!==y);const at=Math.min(x,y);keep.splice(at,0,{v:p,gold:true});chips=keep;sel=[];
      msg=`${fmt(p)} 🎉 Teraz zostało: ${chips.map(c=>fmt(c.v)).join(' · ')}`;sMagic();draw();
    }else{
      msg=`${chips[x].v} · ${chips[y].v} = ${fmt(p)} — to nie jest okrągła liczba. Szukaj dalej 🔎`;sel=[];sBad();draw();
      el.querySelectorAll('.chip').forEach(c=>{if(+c.dataset.i===x||+c.dataset.i===y)c.classList.add('shake')});
    }
  }
  draw();
}

home();
